# Local run: docker compose up --build
# Then open http://localhost:8080 for the status page.
services:
  blender-mcp:
    build:
      context: .
      platform: linux/amd64
    image: blender-mcp-blitz:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Change this before exposing the container to a network.
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-dev-token-change-me}"
      # headless fits a 512 MB ceiling; use gui + more memory for viewport/EEVEE.
      BLENDER_MODE: "${BLENDER_MODE:-headless}"
      AUTOSAVE_SECONDS: "300"
      CYCLES_SAMPLES: "32"
      CYCLES_CPU_THREADS: "1"
      LOOK_ENGINE: "CYCLES"
      LOOK_SAMPLES: "16"
      LOOK_MAX_SIZE: "640"
    volumes:
      - blender-data:/data
    # Mirror blitz.cloud's Small ceiling so you find OOM problems locally.
    # Measured peak for the default headless config is ~466 MB.
    # Raise to 1g (and BLENDER_MODE=gui) to mirror blitz's Medium size.
    mem_limit: "${MEM_LIMIT:-512m}"
    # Blender's software OpenGL renderer needs shared memory in GUI mode.
    shm_size: "512m"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  blender-data:
